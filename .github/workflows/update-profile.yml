name: Update Profile

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  update-profile:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate typing SVG and install devicons
        run: |
          mkdir -p profile/icons
          npm install --no-save devicon
          for icon in csharp dotnetcore python fastapi typescript react vitejs tailwindcss postgresql redis docker; do
            cp "node_modules/devicon/icons/${icon}/${icon}-original.svg" "profile/icons/${icon}.svg" 2>/dev/null || \
            cp "node_modules/devicon/icons/${icon}/${icon}-plain.svg" "profile/icons/${icon}.svg" 2>/dev/null || true
          done
          # Create typing.svg with properly escaped &
          cat > profile/typing.svg << 'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" width="680" height="45" viewBox="0 0 680 45">
            <style>
              .text { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 20px; font-weight: 700; fill: #58a6ff; }
              .line { opacity: 0; animation: cycle 12s infinite; }
              .l1 { animation-delay: 0s; }
              .l2 { animation-delay: 4s; }
              .l3 { animation-delay: 8s; }
              @keyframes cycle {
                0% { opacity: 0; clip-path: inset(0 100% 0 0); }
                8% { opacity: 1; clip-path: inset(0 0 0 0); }
                25% { opacity: 1; clip-path: inset(0 0 0 0); }
                33% { opacity: 0; clip-path: inset(0 100% 0 0); }
                100% { opacity: 0; }
              }
            </style>
            <text x="50%" y="30" text-anchor="middle" class="text line l1">> whoami: Виктория Пестова · Backend & Fullstack</text>
            <text x="50%" y="30" text-anchor="middle" class="text line l2">> stack: C# · .NET 8 · Python · FastAPI · React</text>
            <text x="50%" y="30" text-anchor="middle" class="text line l3">> focus: Microservices · Local RAG · 1C DevTools</text>
          </svg>
          EOF

      - name: Generate snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: kopityle
          outputs: profile/snake.svg?palette=github-dark

      - name: Generate stats SVG
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=kopityle&show_icons=true&theme=github_dark&hide_border=true&bg_color=0d1117
          path: profile/stats.svg

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=kopityle&layout=compact&langs_count=6&theme=github_dark&hide_border=true&bg_color=0d1117
          path: profile/top-langs.svg

      - name: Commit and push profile assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/
          git commit -m "Update profile assets" || exit 0
          git push