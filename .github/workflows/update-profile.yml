name: Update Profile

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  update-profile:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Generate typing SVG and download devicons
        run: |
          mkdir -p profile/icons
          cat << 'EOF' > profile/typing.svg
          <svg xmlns="http://www.w3.org/2000/svg" width="680" height="45" viewBox="0 0 680 45">
            <style>
              .text { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 20px; font-weight: 700; fill: #58a6ff; }
              .line { opacity: 0; animation: cycle 12s infinite; }
              .l1 { animation-delay: 0s; }
              .l2 { animation-delay: 4s; }
              .l3 { animation-delay: 8s; }
              @keyframes cycle {
                0% { opacity: 0; clip-path: inset(0 100% 0 0); }
                8% { opacity: 1; clip-path: inset(0 0 0 0); }
                25% { opacity: 1; clip-path: inset(0 0 0 0); }
                33% { opacity: 0; clip-path: inset(0 100% 0 0); }
                100% { opacity: 0; }
              }
            </style>
            <text x="50%" y="30" text-anchor="middle" class="text line l1">> whoami: Виктория Пестова · Backend & Fullstack</text>
            <text x="50%" y="30" text-anchor="middle" class="text line l2">> stack: C# · .NET 8 · Python · FastAPI · React</text>
            <text x="50%" y="30" text-anchor="middle" class="text line l3">> focus: Microservices · Local RAG · 1C DevTools</text>
          </svg>
          EOF

          for icon in csharp dotnetcore python fastapi typescript react vitejs tailwindcss postgresql redis docker; do
            curl -fsSL -o profile/icons/${icon}.svg "https://githubusercontent.com{icon}/${icon}-original.svg"
          done

      - name: Generate snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: kopityle
          outputs: profile/snake.svg?palette=github-dark

      - name: Generate candles SVG
        uses: b1337xyz/github-candles@main
        continue-on-error: true

      - name: Generate top languages card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=kopityle&layout=compact&theme=github_dark&hide_border=true&bg_color=0d1117
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push profile assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/
          git commit -m "Update profile assets" || exit 0
          git push