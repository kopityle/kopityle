name: Update Profile

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  update-profile:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Create profile directory and download icons
        run: |
          mkdir -p profile/icons
          curl -fsSL -o profile/banner.svg https://vercel.app
          curl -fsSL -o profile/skills.svg https://skillicons.dev || curl -fsSL -o profile/skills.svg https://vercel.app?format=svg
          curl -fsSL -o profile/typing.svg - <<'EOF'
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="50">
  <defs>
    <style>
      @keyframes type {
        0% { opacity: 0; }
        50% { opacity: 1; }
        100% { opacity: 0; }
      }
      .text { animation: type 3s infinite; }
    </style>
  </defs>
  <text class="text" x="0" y="30">Виктория Пестова · C# · .NET 8 · Python · FastAPI · React · Микросервисы · RAG</text>
</svg>
EOF
          for icon in csharp dotnetcore python fastapi typescript react vitejs tailwindcss postgresql redis docker; do
            curl -fsSL -o profile/icons/${icon}.svg "https://githubusercontent.com/kopityle/${icon}.svg" || echo "Failed to download ${icon}"
          done

      - name: Update profile assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/
          git commit -m "Update profile assets" || exit 0
          git push

      - uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=kopityle&layout=compact&theme=github_dark&hide_border=true&bg_color=0d1117
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}