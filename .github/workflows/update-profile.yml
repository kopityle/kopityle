name: Update Profile

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  update-profile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p profile
      - run: curl -fsSL "https://vercel.app" -o profile/banner.svg
      - run: curl -fsSL "https://skillicons.dev" -o profile/skills.svg
      - uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=kopityle&layout=compact&theme=github_dark&hide_border=true&bg_color=0d1117
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Update profile assets"
          branch: main
